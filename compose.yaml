services:
  eem:
    build:
      context: .
      target: eem
    user: root
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_ALLOWED_USERS: ${GITHUB_ALLOWED_USERS:-}
      PROXY_DOMAIN: ${PROXY_DOMAIN:-env.localhost}
      PROXY_PUBLIC_PORT: ${PROXY_PUBLIC_PORT:-8000}
      PROXY_CONTAINER: ${PROXY_CONTAINER:-eem-proxy}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      target: worker
    user: root
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      WORKER_INTERVAL: 30s
      PROXY_DOMAIN: ${PROXY_DOMAIN:-env.localhost}
      PROXY_PUBLIC_PORT: ${PROXY_PUBLIC_PORT:-8000}
      PROXY_CONTAINER: ${PROXY_CONTAINER:-eem-proxy}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      migrate:
        condition: service_completed_successfully

  proxy:
    build:
      context: .
      target: proxy
    container_name: ${PROXY_CONTAINER:-eem-proxy}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      PROXY_DOMAIN: ${PROXY_DOMAIN:-env.localhost}
      PROXY_LISTEN_ADDR: 10.231.0.10:80
    ports:
      - "${PROXY_PUBLIC_PORT:-8000}:80"
    networks:
      edge:
        ipv4_address: 10.231.0.10
    depends_on:
      migrate:
        condition: service_completed_successfully

  migrate:
    image: migrate/migrate:v4.18.3
    command:
      [
        "-path",
        "/migrations",
        "-database",
        "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable",
        "up",
      ]
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - default
      - edge
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - 6379:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  edge:
    ipam:
      config:
        - subnet: 10.231.0.0/24

volumes:
  pgdata:
