# DOCKER_GID: 0 on Docker Desktop, the docker group on Linux (getent group docker | cut -d: -f3).
x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

x-docker-access: &docker-access
  group_add: ["${DOCKER_GID:-0}"]
  volumes:
    - /var/run/docker.sock:/var/run/docker.sock

x-database-url: &database-url postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
x-proxy-secret: &proxy-secret ${PROXY_SECRET:?set PROXY_SECRET in .env, for example with openssl rand -hex 32}

services:
  eem:
    <<: [*hardened, *docker-access]
    build:
      context: .
      target: eem
    ports:
      - "${EEM_PORT:-8080}:8080"
      - "127.0.0.1:${EEM_ADMIN_PORT:-9090}:9090"
    environment:
      DATABASE_URL: *database-url
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_ALLOWED_USERS: ${GITHUB_ALLOWED_USERS:-}
      INLINE_TEMPLATES: ${INLINE_TEMPLATES:-true}
      PROXY_DOMAIN: ${PROXY_DOMAIN:-env.localhost}
      PROXY_PUBLIC_PORT: ${PROXY_PUBLIC_PORT:-8000}
      PROXY_CONTAINER: ${PROXY_CONTAINER:-eem-proxy}
      PROXY_SECRET: *proxy-secret
      EEM_INSTANCE: ${EEM_INSTANCE:-${COMPOSE_PROJECT_NAME}}
      DOCKER_PIDS_LIMIT: ${DOCKER_PIDS_LIMIT:-1024}
      DOCKER_DISK_QUOTA: ${DOCKER_DISK_QUOTA:-false}
      LOG_FORMAT: ${LOG_FORMAT:-text}
    healthcheck:
      test: ["CMD", "/eem", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      proxy:
        condition: service_started

  worker:
    <<: [*hardened, *docker-access]
    build:
      context: .
      target: worker
    ports:
      - "127.0.0.1:${WORKER_ADMIN_PORT:-9091}:9090"
    environment:
      DATABASE_URL: *database-url
      WORKER_INTERVAL: ${WORKER_INTERVAL:-30s}
      PROXY_DOMAIN: ${PROXY_DOMAIN:-env.localhost}
      PROXY_PUBLIC_PORT: ${PROXY_PUBLIC_PORT:-8000}
      PROXY_CONTAINER: ${PROXY_CONTAINER:-eem-proxy}
      PROXY_SECRET: *proxy-secret
      EEM_INSTANCE: ${EEM_INSTANCE:-${COMPOSE_PROJECT_NAME}}
      DOCKER_PIDS_LIMIT: ${DOCKER_PIDS_LIMIT:-1024}
      DOCKER_DISK_QUOTA: ${DOCKER_DISK_QUOTA:-false}
      LOG_FORMAT: ${LOG_FORMAT:-text}
    healthcheck:
      test: ["CMD", "/worker", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Listens only on its edge address: it joins every environment's network.
  proxy:
    <<: *hardened
    build:
      context: .
      target: proxy
    container_name: ${PROXY_CONTAINER:-eem-proxy}
    environment:
      DATABASE_URL: *database-url
      PROXY_DOMAIN: ${PROXY_DOMAIN:-env.localhost}
      PROXY_LISTEN_ADDR: ${PROXY_IP:-10.231.0.10}:80
      PROXY_SECRET: *proxy-secret
      ADMIN_ADDR: ${PROXY_IP:-10.231.0.10}:9090
      LOG_FORMAT: ${LOG_FORMAT:-text}
    ports:
      - "${PROXY_PUBLIC_PORT:-8000}:80"
      - "127.0.0.1:${PROXY_ADMIN_PORT:-9092}:9090"
    networks:
      edge:
        ipv4_address: ${PROXY_IP:-10.231.0.10}
    healthcheck:
      test: ["CMD", "/proxy", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      migrate:
        condition: service_completed_successfully

  tools:
    <<: *hardened
    build:
      context: .
      target: tools
    profiles: [tools]
    restart: "no"
    environment:
      DATABASE_URL: *database-url
    depends_on:
      migrate:
        condition: service_completed_successfully

  migrate:
    image: migrate/migrate:v4.18.3
    command: ["-path", "/migrations", "-database", *database-url, "up"]
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - default
      - edge
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  edge:
    ipam:
      config:
        - subnet: ${EDGE_SUBNET:-10.231.0.0/24}

volumes:
  pgdata:
